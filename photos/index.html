    *,

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: var(--fonts-body);
      border: 0;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    @keyframes k-PnvVd {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(80px);
      }

      100% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0);
      }
    }

    .dock {
      display: flex;
      align-items: flex-end;
      width: auto;
      height: 58px;
      padding-left: 8px;
      padding-right: 8px;
      position: fixed;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: var(--shadows-large);
      -webkit-backdrop-filter: blur(100px) saturate(400%) brightness(100%);
      backdrop-filter: blur(100px) saturate(400%) brightness(100%);
      border: 1px solid var(--colors-grayA4);
      bottom: -8px;
      left: 50%;
      border-radius: 9999px;
      z-index: 10;
      transform: translate(-50%, -50%) translateY(80px);
      animation: k-PnvVd 500ms ease forwards 200ms;
    }

    .dark .dock {
      background: rgba(22, 22, 22, 0.8);
    }

    @media (max-width: 430px) {
      .dock {
        width: calc(100% - 69px);
        top: unset;
        bottom: 0;
      }
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 100vh;
      padding: 8px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
      gap: 8px;
    }

    @media (max-width: 720px) {
      .gallery {
        padding: 0;
      }
    }

    @media (max-width: 440px) {
      .gallery {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    }

    .photo-item {
      display: inline-block;
      position: relative;
      overflow: hidden;
      height: 700px;
      outline: 0;
      border-radius: 8px;
    }

    @media (max-width: 720px) {
      .photo-item {
        width: 100%;
        min-width: unset;
        pointer-events: none;
      }
    }

    @media (max-width: 440px) {
      .photo-item {
        height: 420px;
      }
    }

    .photo-item img {
      -webkit-user-select: none;
      user-select: none;
      object-fit: cover;
    }

    .photo-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: inherit;
      filter: blur(32px);
      transform: scale(1.2) translateZ(0);
      transition: opacity 400ms ease;
    }

    .photo-real {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 400ms ease;
    }

    .photo-real.loaded {
      opacity: 1;
    }

    .photo-real.loaded+.photo-placeholder,
    .photo-item.loaded .photo-placeholder {
      opacity: 0;
    }
  </style>

  <script defer src="../assets/js/main.js"></script>
  <script>
    (function () {
      "use strict";

      var PROJECT_ID = "m77bsvm1";
      var DATASET = "production";
      var API_VERSION = "2024-01-01";
      var CACHE_KEY = "photos_sanity_cache_v1";

      var gallery = document.getElementById("gallery");
      if (!gallery) return;

      function buildItem(photo, index) {
        var url = photo.imageUrl
          ? photo.imageUrl + "?auto=format&fit=crop&w=1200&q=85"
          : "";
        var thumbUrl = photo.lqip
          ? photo.lqip
          : photo.imageUrl
            ? photo.imageUrl + "?auto=format&fit=crop&w=40&blur=20&q=20"
            : "";

        var li = document.createElement("li");
        li.className = "photo-item";
        var placeholder = document.createElement("img");
        placeholder.className = "photo-placeholder";
        placeholder.setAttribute("aria-hidden", "true");
        placeholder.alt = "";
        placeholder.src = thumbUrl;
        var img = document.createElement("img");
        img.className = "photo-real";
        img.alt = photo.alt || "Photo";
        if (index === 0) {
          img.fetchPriority = "high";
          img.decoding = "async";
        } else {
          img.loading = "lazy";
          img.decoding = "async";
        }
        img.src = url;

        img.addEventListener("load", function () {
          img.classList.add("loaded");
          placeholder.style.opacity = "0";
        });

        if (img.complete && img.naturalWidth > 0) {
          img.classList.add("loaded");
          placeholder.style.opacity = "0";
        }

        li.appendChild(placeholder);
        li.appendChild(img);
        return li;
      }

      function renderGallery(photos) {
        if (!Array.isArray(photos)) return;
        gallery.innerHTML = "";
        photos.forEach(function (photo, i) {
          if (photo && photo.imageUrl) {
            gallery.appendChild(buildItem(photo, i));
          }
        });
      }

      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          var cached = JSON.parse(raw);
          if (Array.isArray(cached) && cached.length > 0) {
            renderGallery(cached);
          }
        }
      } catch (e) { }

      var groq =
        '*[_type == "photo"] | order(_createdAt desc){ _id, "alt": image.alt, "imageUrl": image.asset->url, "lqip": image.asset->metadata.lqip }';
      var url =
        "https://" +
        PROJECT_ID +
        ".apicdn.sanity.io/v" +
        API_VERSION +
        "/data/query/" +
        DATASET +
        "?query=" +
        encodeURIComponent(groq);

      fetch(url)
        .then(function (r) {
          if (!r.ok) throw new Error("Sanity fetch status: " + r.status);
          return r.json();
        })
        .then(function (data) {
          var items = (data && data.result) || [];
          if (Array.isArray(items)) {
            try {
              localStorage.setItem(CACHE_KEY, JSON.stringify(items));
            } catch (e) { }
            renderGallery(items);
          }
        })
        .catch(function (err) {
          console.warn("[photos] Sanity fetch error:", err);
        });
    })();
  </script>
