      /* ── Design tokens ── */
      :root {

        --shadows-large: 0 30px 60px rgba(0, 0, 0, 0.12);
        --fonts-body: X, -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",

        --colors-gray2: hsl(0 0% 11%);
        --colors-gray3: hsl(0 0% 13.6%);
        --colors-gray4: hsl(0 0% 15.8%);

        --colors-gray12: hsl(0 0% 93%);
        --colors-grayA4: hsl(0 0% 100% / 0.077);
        --colors-grayA6: hsl(0 0% 100% / 0.129);
      }

      /* ── Reset ── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        font-family: var(--fonts-body);
        background: var(--colors-gray1);
      }
      ::selection { background: #fff9a8; color: black; }
      a { color: inherit; text-decoration: none; }
      button {
        margin: 0; padding: 0;
        background: transparent;
        font-family: var(--fonts-body);
        border: 0; cursor: pointer;
      }
      ul { list-style: none; padding: 0; margin: 0; }

      /* ── Dock animation ── */
      @keyframes k-PnvVd {
        0%   { opacity: 0; transform: translate(-50%, -50%) translateY(80px); }
        100% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
      }

      /* ── Dock ── */
      .dock {
        display: flex;
        align-items: flex-end;
        width: auto;
        height: 58px;
        padding-left: 8px;
        padding-right: 8px;
        position: fixed;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadows-large);
        -webkit-backdrop-filter: blur(100px) saturate(400%) brightness(100%);
        backdrop-filter: blur(100px) saturate(400%) brightness(100%);
        border: 1px solid var(--colors-grayA4);
        bottom: -8px;
        left: 50%;
        border-radius: 9999px;
        z-index: 10;
        transform: translate(-50%, -50%) translateY(80px);
        animation: k-PnvVd 500ms ease forwards 200ms;
      }
      .dark .dock {
        background: rgba(22, 22, 22, 0.8);
      }
      @media (max-width: 430px) {
        .dock {
          width: calc(100% - 69px);
          top: unset;
          bottom: 0;
        }
      }

      /* ── Page wrapper ── */
      .page-wrapper {
        display: flex;
        flex-direction: column;
        position: relative;
        min-height: 100vh;
        padding: 8px;
      }

      /* ── Gallery grid — exact match to reference ── */
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
        gap: 8px;
      }
      @media (max-width: 720px) {
        .gallery { padding: 0; }
      }
      @media (max-width: 440px) {
        .gallery {
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }
      }

      /* ── Photo card — exact match to reference ── */
      .photo-item {
        display: inline-block;
        position: relative;
        overflow: hidden;
        height: 700px;
        outline: 0;
        border-radius: 8px;
      }
      @media (max-width: 720px) {
        .photo-item {
          width: 100%;
          min-width: unset;
          pointer-events: none;
        }
      }
      @media (max-width: 440px) {
        .photo-item { height: 420px; }
      }
      .photo-item img {
        -webkit-user-select: none;
        user-select: none;
        object-fit: cover;
      }

      /* ── Blurred placeholder (absolutely fills the card) ── */
      .photo-placeholder {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        border-radius: inherit;
        filter: blur(32px);
        transform: scale(1.2) translateZ(0);
        transition: opacity 400ms ease;
      }

      /* ── Real image (absolutely fills the card) ── */
      .photo-real {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        border-radius: inherit;
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .photo-real.loaded {
        opacity: 1;
      }
      .photo-real.loaded + .photo-placeholder,
      .photo-item.loaded .photo-placeholder {
        opacity: 0;
      }
    </style>

          { id: "photo-1484910292437-025e5d13ce87", desc: "Foggy trees" },
        ];

        var gallery = document.getElementById("gallery");
        if (!gallery) return;

        function buildItem(photo, index) {
          var url = "https://images.unsplash.com/" + photo.id + "?auto=format&fit=crop&w=800&q=80";
          var thumbUrl = "https://images.unsplash.com/" + photo.id + "?auto=format&fit=crop&w=20&q=10&blur=10";

          var li = document.createElement("li");
          li.className = "photo-item";

          // Blurred placeholder — tiny version shown immediately
          var placeholder = document.createElement("img");
          placeholder.className = "photo-placeholder";
          placeholder.setAttribute("aria-hidden", "true");
          placeholder.alt = "";
          placeholder.src = thumbUrl;

          // Real image — fades in once loaded
          var img = document.createElement("img");
          img.className = "photo-real";
          img.alt = photo.desc;
          if (index === 0) {
            img.fetchPriority = "high";
            img.decoding = "async";
          } else {
            img.loading = "lazy";
            img.decoding = "async";
          }
          img.src = url;

          img.addEventListener("load", function () {
            img.classList.add("loaded");
            placeholder.style.opacity = "0";
          });

          // If already cached and complete
          if (img.complete && img.naturalWidth > 0) {
            img.classList.add("loaded");
            placeholder.style.opacity = "0";
          }

          li.appendChild(placeholder);
          li.appendChild(img);
          return li;
        }

        // Render all photos
        PHOTOS.forEach(function (photo, i) {
          gallery.appendChild(buildItem(photo, i));
        });

      })();
    </script>
  </body>
</html>
