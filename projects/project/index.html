  <!-- Theme detection: runs before paint to avoid flash -->
  <script>
    !(function () {
      try {
        var d = document.documentElement.classList;
        d.remove("dark", "light");
        var e = localStorage.getItem("theme");
        if ("system" === e || !e) {
          var t = "(prefers-color-scheme: dark)",
            m = window.matchMedia(t);
          m.media !== t || m.matches ? d.add("dark") : d.add("light");
        } else if (e) {
          d.add(e);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/styles.css" />

  <style>
    /* ── Font faces ── */
    @font-face {
      font-family: X;
      font-weight: 400;
      src: url(/X-Regular.woff2) format("woff2");
    }
    @font-face {
      font-family: X;
      font-weight: 500;
      src: url(/X-Medium.woff2) format("woff2");
    }

    /* ── Design tokens (light) ── */
    :root {
      --colors-gray1: hsl(0 0% 99%);
      --colors-gray2: hsl(0 0% 97.3%);
      --colors-gray3: hsl(0 0% 95.1%);
      --colors-gray4: hsl(0 0% 93%);
      --colors-gray5: hsl(0 0% 90.9%);
      --colors-gray6: hsl(0 0% 88.7%);
      --colors-gray7: hsl(0 0% 85.8%);
      --colors-gray8: hsl(0 0% 78%);
      --colors-gray9: hsl(0 0% 56.1%);
      --colors-gray10: hsl(0 0% 52.3%);
      --colors-gray11: hsl(0 0% 43.5%);
      --colors-gray12: hsl(0 0% 9%);
      --colors-grayA1: hsl(0 0% 0% / 0.012);
      --colors-grayA3: hsl(0 0% 0% / 0.047);
      --colors-grayA4: hsl(0 0% 0% / 0.071);
      --colors-grayA6: hsl(0 0% 0% / 0.114);
      --colors-amber9: hsl(39 100% 57%);
      --colors-blue9: hsl(206 100% 50%);
      --colors-green9: hsl(151 55% 41.5%);
      --shadows-small: 0 5px 10px rgba(0, 0, 0, 0.06);
      --shadows-large: 0 30px 60px rgba(0, 0, 0, 0.12);
      --fonts-body: X, -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
      --fonts-mono: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --space-3: 24px;
      --space-4: 32px;

      /* Code block colors (light) */
      --code-bg: var(--colors-gray2);
      --code-border: var(--colors-gray4);
      --code-header-bg: var(--colors-gray3);
      --code-text: var(--colors-gray12);
      --tok-kw: hsl(265, 80%, 52%);
      --tok-str: hsl(150, 65%, 32%);
      --tok-num: hsl(30, 95%, 45%);
      --tok-com: hsl(0, 0%, 55%);
      --tok-fn: hsl(212, 85%, 46%);
    }

    /* ── Design tokens (dark) ── */
    .dark {
      --colors-gray1: hsl(0 0% 8.5%);
      --colors-gray2: hsl(0 0% 11%);
      --colors-gray3: hsl(0 0% 13.6%);
      --colors-gray4: hsl(0 0% 15.8%);
      --colors-gray5: hsl(0 0% 17.9%);
      --colors-gray6: hsl(0 0% 20.5%);
      --colors-gray7: hsl(0 0% 24.3%);
      --colors-gray8: hsl(0 0% 31.2%);
      --colors-gray9: hsl(0 0% 43.9%);
      --colors-gray10: hsl(0 0% 49.4%);
      --colors-gray11: hsl(0 0% 62.8%);
      --colors-gray12: hsl(0 0% 93%);
      --colors-grayA1: hsl(0 0% 100% / 0.01);
      --colors-grayA3: hsl(0 0% 100% / 0.05);
      --colors-grayA4: hsl(0 0% 100% / 0.077);
      --colors-grayA6: hsl(0 0% 100% / 0.129);

      /* Code block colors (dark) */
      --code-bg: var(--colors-gray2);
      --code-border: var(--colors-gray4);
      --code-header-bg: var(--colors-gray3);
      --code-text: var(--colors-gray12);
      --tok-kw: hsl(265, 95%, 76%);
      --tok-str: hsl(145, 65%, 68%);
      --tok-num: hsl(38, 95%, 68%);
      --tok-com: hsl(0, 0%, 52%);
      --tok-fn: hsl(205, 95%, 72%);
    }

    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--fonts-body);
      background: var(--colors-gray1);
      color: var(--colors-gray12);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Bold styling matching landing page bio ── */
    strong, b, .medium-bold {
      font-family: var(--fonts-body);
      font-weight: 500 !important;
      color: var(--colors-gray12) !important;
      letter-spacing: -0.01em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── Layout container ── */
    .project-container {
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 100vh;
      padding: 120px var(--space-3) 140px;
      margin: 0 auto;
      width: 100%;
      max-width: 720px;
      box-sizing: border-box;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    @media (max-width: 720px) {
      .project-container {
        padding-top: 48px;
        padding-bottom: 120px;
      }
    }

    /* ── Top Bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      width: 100%;
    }


    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--colors-gray11);
      padding: 4px 8px;
      margin-left: -8px;
      border-radius: 6px;
      transition: color 150ms ease, background 150ms ease;
    }

    .back-btn:hover {
      color: var(--colors-gray12);
      background: var(--colors-gray3);
    }

    .icon-action-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--colors-gray3);
      border-radius: 9999px;
      color: var(--colors-gray11);
      border: 0;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, transform 100ms ease;
    }

    .icon-action-btn:hover {
      background: var(--colors-gray4);
      color: var(--colors-gray12);
    }

    .icon-action-btn:active {
      transform: scale(0.95);
    }

    /* ── Section 1: Header & Summary ── */
    .header-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .project-h1 {
      font-size: 24px;
      font-weight: 500;
      line-height: 32px;
      letter-spacing: -0.015em;
      color: var(--colors-gray12);
      flex: 1 1 auto;
      min-width: 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .project-year-pill {
      font-size: 13px;
      font-weight: 400;
      color: var(--colors-gray9);
      background: var(--colors-gray3);
      padding: 2px 8px;
      border-radius: 9999px;
      align-self: center;
      flex-shrink: 0;
    }

    .project-pitch {
      font-size: 16px;
      line-height: 26px;
      color: var(--colors-gray11);
      font-weight: 400;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* ── Hero Media ── */
    .hero-media-wrap {
      margin: 16px 0 36px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--colors-gray4);
      background: var(--colors-gray2);
      box-shadow: var(--shadows-small);
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }

    .hero-media-img {
      width: 100%;
      height: auto;
      max-height: 440px;
      object-fit: cover;
      display: block;
    }

    .hero-media-caption {
      padding: 10px 14px;
      font-size: 12px;
      color: var(--colors-gray10);
      background: var(--colors-gray2);
      border-top: 1px solid var(--colors-gray4);
      text-align: center;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* ── Section 2: Metadata at a Glance ── */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      padding: 20px;
      border-radius: 12px;
      background: var(--colors-gray2);
      border: 1px solid var(--colors-gray4);
      margin-bottom: 40px;
      width: 100%;
      box-sizing: border-box;
    }

    @media (max-width: 600px) {
      .meta-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .meta-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--colors-gray9);
      font-weight: 500;
    }

    .meta-val {
      font-size: 14px;
      font-weight: 500;
      color: var(--colors-gray12);
      line-height: 20px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .meta-item--span-all {
      grid-column: 1 / -1;
      border-top: 1px solid var(--colors-gray4);
      padding-top: 14px;
      margin-top: 4px;
    }


    .tech-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tech-pill {
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 9999px;
      background: var(--colors-gray3);
      border: 1px solid var(--colors-gray5);
      color: var(--colors-gray12);
      font-weight: 400;
    }

    /* ── Section Headers ── */
    .section-block {
      margin-bottom: 44px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--colors-gray10);
      margin-bottom: 16px;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--colors-gray4);
    }

    /* ── Section 3: The Problem & Objective ── */
    .problem-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .problem-card {
      padding: 16px 18px;
      border-radius: 10px;
      background: var(--colors-gray2);
      border: 1px solid var(--colors-gray4);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .problem-card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--colors-gray12);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .problem-card-text {
      font-size: 14px;
      color: var(--colors-gray11);
      line-height: 22px;
    }

    /* ── Section 4: Your Direct Contribution ── */
    .contribution-box {
      border-radius: 10px;
      background: var(--colors-gray2);
      border: 1px solid var(--colors-gray4);
      padding: 18px;
    }

    .contribution-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contribution-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      color: var(--colors-gray12);
      line-height: 22px;
    }

    .contribution-list li svg {
      flex-shrink: 0;
      margin-top: 3px;
      color: var(--colors-gray10);
    }

    /* ── Section 5: Process & Architecture ── */
    .architecture-body {
      font-size: 15px;
      line-height: 28px;
      color: var(--colors-gray11);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .architecture-body h2 {
      font-size: 16px;
      font-weight: 500;
      color: var(--colors-gray12);
      margin: 32px 0 12px;
      line-height: 24px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .architecture-body h3 {
      font-size: 14px;
      font-weight: 500;
      color: var(--colors-gray12);
      margin: 24px 0 10px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .architecture-body p,
    .architecture-body li {
      font-size: 15px;
      line-height: 28px;
      margin-bottom: 14px;
      color: var(--colors-gray12);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* Quotes: Full body text size (never shrunk) with clean accent */
    blockquote,
    .architecture-body blockquote,
    .quote-block {
      font-size: 15px !important;
      line-height: 28px !important;
      border-left: 2px solid var(--colors-gray7);
      padding-left: 18px;
      margin: 22px 0;
      color: var(--colors-gray12);
      font-style: normal;
      font-weight: 400;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .architecture-body figure {
      margin: 24px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--colors-gray4);
      background: var(--colors-gray2);
      width: 100%;
      box-sizing: border-box;
    }

    .architecture-body figure img {
      width: 100%;
      height: auto;
      display: block;
    }

    .architecture-body figcaption {
      font-size: 12px;
      color: var(--colors-gray10);
      padding: 8px 12px;
      text-align: center;
      border-top: 1px solid var(--colors-gray4);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* ── Code snippet styling & colored syntax tokens ── */
    .codeblock-wrap {
      margin: 22px 0;
      border-radius: 8px;
      border: 1px solid var(--code-border);
      background: var(--code-bg);
      overflow: hidden;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .codeblock-header {
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--colors-gray10);
      background: var(--code-header-bg);
      border-bottom: 1px solid var(--code-border);
      font-family: var(--fonts-mono);
    }

    .codeblock-copy-btn {
      background: transparent;
      border: 0;
      color: var(--colors-gray10);
      cursor: pointer;
      font-size: 11px;
      font-family: var(--fonts-body);
      padding: 2px 8px;
      border-radius: 4px;
      transition: color 150ms ease, background 150ms ease;
    }

    .codeblock-copy-btn:hover {
      color: var(--colors-gray12);
      background: var(--colors-gray4);
    }

    .codeblock-body {
      padding: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      font-family: var(--fonts-mono);
      font-size: 13px;
      line-height: 22px;
      color: var(--code-text);
      white-space: pre;
      word-break: normal;
      word-wrap: normal;
      max-width: 100%;
      box-sizing: border-box;
      margin: 0;
    }

    .code-line {
      display: block;
      min-height: 22px;
    }

    /* Syntax Tokens */
    .tok-kw { color: var(--tok-kw); font-weight: 500; }
    .tok-str { color: var(--tok-str); }
    .tok-num { color: var(--tok-num); }
    .tok-com { color: var(--tok-com); font-style: italic; }
    .tok-fn { color: var(--tok-fn); }
    .tok-op { color: var(--colors-gray12); }
    .tok-tag { color: var(--tok-fn); }
    .tok-attr { color: var(--tok-kw); }

    /* ── Section 6: Key Challenges & Trade-offs ── */
    .challenges-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .challenge-card {
      padding: 16px 18px;
      border-radius: 10px;
      background: var(--colors-gray2);
      border: 1px solid var(--colors-gray4);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .challenge-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--colors-gray12);
    }

    .challenge-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    @media (max-width: 640px) {
      .challenge-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    .challenge-subblock {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      line-height: 20px;
      min-width: 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .challenge-subblock-tag {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--colors-gray10);
    }

    .challenge-subblock-text {
      color: var(--colors-gray11);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* ── Section 7: Results & Impact ── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-card {
      padding: 18px;
      border-radius: 10px;
      background: var(--colors-gray2);
      border: 1px solid var(--colors-gray4);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-num {
      font-size: 28px;
      font-weight: 500;
      color: var(--colors-gray12);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .metric-lbl {
      font-size: 13px;
      font-weight: 500;
      color: var(--colors-gray12);
    }

    .metric-desc {
      font-size: 12px;
      color: var(--colors-gray10);
      line-height: 16px;
    }

    .impact-summary-text {
      font-size: 14px;
      line-height: 24px;
      color: var(--colors-gray11);
      padding: 14px 18px;
      border-radius: 10px;
      background: var(--colors-gray2);
      border: 1px solid var(--colors-gray4);
    }

    /* ── Section 8: Artifacts & Links ── */
    .artifacts-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .artifact-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--colors-gray3);
      border: 1px solid var(--colors-gray5);
      color: var(--colors-gray12);
      font-size: 13px;
      font-weight: 500;
      transition: background 150ms ease, border-color 150ms ease, transform 100ms ease;
    }

    .artifact-btn:hover {
      background: var(--colors-gray4);
      border-color: var(--colors-gray6);
    }

    .artifact-btn:active {
      transform: scale(0.98);
    }

    .artifact-btn--primary {
      background: var(--colors-gray12);
      color: var(--colors-gray1);
      border-color: var(--colors-gray12);
    }

    .artifact-btn--primary:hover {
      background: var(--colors-gray11);
      border-color: var(--colors-gray11);
      color: var(--colors-gray1);
    }

    /* ── Pagination Nav ── */
    .pagination-nav {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 14px;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--colors-gray4);
    }

    .nav-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--colors-gray2);
      border: 1px solid var(--colors-gray4);
      transition: background 150ms ease, border-color 150ms ease;
    }

    .nav-card:hover {
      background: var(--colors-gray3);
      border-color: var(--colors-gray6);
    }

    .nav-card-dir {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--colors-gray10);
    }

    .nav-card-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--colors-gray12);
    }

    /* ── Loading / Error State ── */
    .state-box {
      text-align: center;
      padding: 60px 20px;
