    <style>
      .projects-grid {
        max-width: 672px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1px;
        background: var(--gray4);
        border-radius: 12px;
        overflow: hidden;
      }

      .project-card {
        display: flex;
        flex-direction: column;
        background: var(--gray1);
        text-decoration: none;
        color: inherit;
        transition: background 150ms ease;
        overflow: hidden;
      }

      .project-card:hover { background: var(--gray2); }

      .project-cover {
        width: 100%;
        height: 160px;
        object-fit: cover;
        background: var(--gray3);
        display: block;
      }

      .project-cover-placeholder {
        width: 100%;
        height: 160px;
        background: var(--gray3);
      }

      .project-body {
        padding: 16px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }

      .project-title {
        font-size: 15px;
        font-weight: 500;
        color: var(--gray12);
        letter-spacing: -0.3px;
      }

      .project-desc {
        font-size: 13px;
        color: var(--gray10);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .project-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }

      .project-tag {
        font-size: 11px;
        color: var(--gray9);
        background: var(--gray3);
        padding: 2px 8px;
        border-radius: 9999px;
        text-transform: lowercase;
      }

      .project-links {
        display: flex;
        gap: 10px;
        margin-top: auto;
        padding-top: 12px;
      }

      .project-link {
        font-size: 12px;
        color: var(--gray10);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: color 150ms ease;
      }

      .project-link:hover { color: var(--gray12); }

      .page-header {
        max-width: 672px;
        margin: 0 auto 32px;
      }

      .page-title {
        font-size: 14px;
        color: var(--gray10);
        text-transform: lowercase;
        letter-spacing: -0.2px;
        margin-bottom: 24px;
      }

      .empty-state {
        max-width: 672px;
        margin: 0 auto;
        color: var(--gray9);
        font-size: 14px;
        text-transform: lowercase;
      }
    </style>

    <script src="../assets/js/main.js"></script>
    <script>
      (function () {
        'use strict';

        var PROJECT_ID  = 'bps9n75q';
        var DATASET     = 'production';
        var API_VERSION = '2024-01-01';
        var CACHE_KEY   = 'projects_v2';

        /* ── Sanity CDN image URL ── */
        function sanityImageUrl(ref, w) {
          if (!ref) return null;
          var parts = ref.split('-');
          var fmt  = parts[parts.length - 1];
          var dims = parts[parts.length - 2];
          var id   = parts.slice(1, parts.length - 2).join('-');
          return 'https://cdn.sanity.io/images/' + PROJECT_ID + '/' + DATASET + '/' +
                 id + '-' + dims + '.' + fmt + (w ? '?w=' + w + '&auto=format&fit=crop' : '');
        }

        /* ── sessionStorage cache ── */
        function readCache() {
          try { return JSON.parse(sessionStorage.getItem(CACHE_KEY)); } catch(e) { return null; }
        }
        function writeCache(items) {
          try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch(e) {}
        }

        /* ── HTML escape ── */
        function esc(s) {
          return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        /* ── GROQ — fire IMMEDIATELY at parse time ── */
        var GROQ = '*[_type == "project"] | order(publishedAt desc) { _id, title, description, url, github, coverImage, tags }';

        /* Cache-first: if session cache exists render instantly, skip network.
           Otherwise fetch starts right now, before DOMContentLoaded. */
        var cached = readCache();
        var fetchPromise = cached
          ? Promise.resolve(cached)
          : fetch(
              'https://' + PROJECT_ID + '.apicdn.sanity.io/v' + API_VERSION +
              '/data/query/' + DATASET + '?query=' + encodeURIComponent(GROQ)
            ).then(function (r) { return r.json(); })
              .then(function (d) { var items = (d && d.result) || []; writeCache(items); return items; });

        /* ── Render one card ── */
        function renderCard(p) {
          var imgHtml = (p.coverImage && p.coverImage.asset)
            ? '<img class="project-cover" src="' + esc(sanityImageUrl(p.coverImage.asset._ref, 560)) + '" alt="' + esc(p.title) + '" loading="lazy" decoding="async" />'
            : '<div class="project-cover-placeholder"></div>';

          var tagsHtml = (p.tags && p.tags.length)
            ? '<div class="project-tags">' + p.tags.map(function(t){ return '<span class="project-tag">' + esc(t) + '</span>'; }).join('') + '</div>'
            : '';

          var links = '';
          if (p.url)    links += '<a href="' + esc(p.url)    + '" target="_blank" rel="noopener noreferrer" class="project-link" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>live</a>';
          if (p.github) links += '<a href="' + esc(p.github) + '" target="_blank" rel="noopener noreferrer" class="project-link" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.475 2 2 6.475 2 12a9.994 9.994 0 006.838 9.488c.5.087.687-.213.687-.476 0-.237-.013-1.024-.013-1.862-2.512.463-3.162-.612-3.362-1.175-.113-.288-.6-1.175-1.025-1.413-.35-.187-.85-.65-.013-.662.788-.013 1.35.725 1.538 1.025.9 1.512 2.338 1.087 2.912.825.088-.65.35-1.087.638-1.337-2.225-.25-4.55-1.113-4.55-4.938 0-1.088.387-1.987 1.025-2.688-.1-.25-.45-1.275.1-2.65 0 0 .837-.262 2.75 1.026a9.28 9.28 0 012.5-.338c.85 0 1.7.112 2.5.337 1.912-1.3 2.75-1.024 2.75-1.024.55 1.375.2 2.4.1 2.65.637.7 1.025 1.587 1.025 2.687 0 3.838-2.337 4.688-4.562 4.938.362.312.675.912.675 1.85 0 1.337-.013 2.412-.013 2.75 0 .262.188.574.688.474A10.016 10.016 0 0022 12c0-5.525-4.475-10-10-10z"/></svg>github</a>';

          return '<div class="project-card">' +
            imgHtml +
            '<div class="project-body">' +
              '<div class="project-title">' + esc(p.title) + '</div>' +
              (p.description ? '<div class="project-desc">' + esc(p.description) + '</div>' : '') +
              tagsHtml +
              (links ? '<div class="project-links">' + links + '</div>' : '') +
            '</div></div>';
        }

        /* ── Render list ── */
        function render(items) {
          var el = document.getElementById('projects-container');
          if (!el) return;
          if (!items || !items.length) {
            el.innerHTML = '<p class="empty-state">no projects yet.</p>';
            return;
          }
          el.innerHTML = '<div class="projects-grid">' + items.map(renderCard).join('') + '</div>';
        }

        /* ── Boot ── */
        if (cached) {
          /* Instant paint from session cache — no network wait */
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () { render(cached); });
          } else {
            render(cached);
          }
        } else {
          /* Fresh load — resolve when fetch + DOM both ready */
          fetchPromise.then(function (items) {
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', function () { render(items); });
            } else {
              render(items);
            }
          }).catch(function () {
            var el = document.getElementById('projects-container');
            if (el) el.innerHTML = '<p class="empty-state">failed to load projects.</p>';
          });
        }

      })();
    </script>
