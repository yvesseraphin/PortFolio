<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Blog — Seraphin</title>
    <link rel="shortcut icon" href="favicon.svg" />
    <meta name="author" content="Seraphin" />
    <meta name="description" content="Thoughts and writing by Seraphin." />
    <script>
      !(function () {
        try {
          var d = document.documentElement.classList;
          d.remove("dark", "light");
          var e = localStorage.getItem("theme");
          if ("system" === e || !e) {
            var t = "(prefers-color-scheme: dark)", m = window.matchMedia(t);
            m.media !== t || m.matches ? d.add("dark") : d.add("light");
          } else if (e) { d.add(e); }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="X-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="X-Medium.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .posts-grid {
        max-width: 672px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1px;
        background: var(--gray4);
        border-radius: 12px;
        overflow: hidden;
      }

      .post-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 20px 24px;
        background: var(--gray1);
        text-decoration: none;
        color: inherit;
        transition: background 150ms ease;
        cursor: pointer;
      }

      .post-card:hover { background: var(--gray2); }

      .post-card:first-child { border-radius: 12px 12px 0 0; }
      .post-card:last-child  { border-radius: 0 0 12px 12px; }
      .post-card:only-child  { border-radius: 12px; }

      .post-title {
        font-size: 16px;
        font-weight: 500;
        color: var(--gray12);
        letter-spacing: -0.3px;
      }

      .post-excerpt {
        font-size: 14px;
        color: var(--gray10);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .post-meta {
        font-size: 13px;
        color: var(--gray9);
      }

      .post-cover {
        width: 80px;
        height: 60px;
        object-fit: cover;
        border-radius: 6px;
        flex-shrink: 0;
        background: var(--gray3);
      }

      .post-card-inner {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .post-card-text { flex: 1; min-width: 0; }

      .page-header {
        max-width: 672px;
        margin: 0 auto 32px;
      }

      .page-title {
        font-size: 14px;
        color: var(--gray10);
        text-transform: lowercase;
        letter-spacing: -0.2px;
        margin-bottom: 24px;
      }

      .empty-state {
        max-width: 672px;
        margin: 0 auto;
        color: var(--gray9);
        font-size: 14px;
        text-transform: lowercase;
      }

      .skeleton {
        background: var(--gray3);
        border-radius: 4px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>

    <script src="assets/js/main.js"></script>
    <script>
      // ── Sanity config ──
      const PROJECT_ID = 'bps9n75q';
      const DATASET = 'production';
      const API_VERSION = '2024-01-01';

      function sanityImageUrl(ref) {
        if (!ref) return null;
        const [, id, dims, fmt] = ref.split('-');
        return `https://cdn.sanity.io/images/${PROJECT_ID}/${DATASET}/${id}-${dims}.${fmt}`;
      }

      function formatDate(iso) {
        if (!iso) return '';
        return new Date(iso).toLocaleDateString([], {year: 'numeric', month: 'long', day: 'numeric'});
      }

      async function loadPosts() {
        const query = encodeURIComponent(
          `*[_type == "post"] | order(publishedAt desc) { _id, title, slug, publishedAt, excerpt, coverImage }`
        );
        const url = `https://${PROJECT_ID}.api.sanity.io/v${API_VERSION}/data/query/${DATASET}?query=${query}`;

        const container = document.getElementById('posts-container');

        // Show skeletons
        container.innerHTML = Array(3).fill(`
          <div class="post-card">
            <div class="post-card-inner">
              <div class="post-card-text">
                <div class="skeleton" style="height:16px;width:60%;margin-bottom:8px;"></div>
                <div class="skeleton" style="height:13px;width:90%;margin-bottom:4px;"></div>
                <div class="skeleton" style="height:13px;width:70%;"></div>
              </div>
              <div class="skeleton post-cover"></div>
            </div>
          </div>
        `).join('');
        container.querySelector('.post-card').style.borderRadius = '12px 12px 0 0';

        try {
          const res = await fetch(url);
          const { result } = await res.json();

          if (!result || result.length === 0) {
            container.innerHTML = '<p class="empty-state">no posts yet.</p>';
            return;
          }

          container.innerHTML = `<div class="posts-grid">${result.map((post, i) => `
            <a
              href="/post.html?slug=${post.slug.current}"
              class="post-card"
              aria-label="${post.title}"
            >
              <div class="post-card-inner">
                <div class="post-card-text">
                  <div class="post-title">${post.title}</div>
                  ${post.excerpt ? `<div class="post-excerpt">${post.excerpt}</div>` : ''}
                  <div class="post-meta">${formatDate(post.publishedAt)}</div>
                </div>
                ${post.coverImage ? `<img class="post-cover" src="${sanityImageUrl(post.coverImage.asset._ref)}?w=160&h=120&fit=crop" alt="${post.title}" loading="lazy" />` : ''}
              </div>
            </a>
          `).join('')}</div>`;
        } catch (err) {
          container.innerHTML = '<p class="empty-state">failed to load posts.</p>';
        }
      }

      loadPosts();
    </script>
